<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teo — Diet Tracker</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #030f0f;
            --accent: #00df82;
            --white: #ffffff;
            --card-bg: #0a1a1a;
            --border: #142b2b;
            --text-muted: #526b6b;
            
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--white);
            min-height: 100vh;
            padding: calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 30px) 24px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- NAV BAR --- */
        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .back-btn:hover, .back-btn:active {
            color: var(--accent);
        }

        /* Badge Giorno Cliccabile */
        .day-badge-trigger {
            background: rgba(0, 223, 130, 0.08);
            border: 1px solid rgba(0, 223, 130, 0.2);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .day-badge-trigger:active {
            transform: scale(0.95);
            background: rgba(0, 223, 130, 0.15);
        }

        .profile-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        /* Banner Stato Sola Lettura */
        .read-only-banner {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        /* --- CARTE DEI PASTI (STILE CESCA) --- */
        .pasti-flow {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pasto-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .pasto-main-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .pasto-label {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Lista Alimenti Interna */
        .alimenti-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alimento-row {
            display: flex;
            align-items: center;
            width: 100%;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.95);
        }

        .alimento-dot {
            color: var(--accent);
            font-size: 1.2rem;
            margin-right: 8px;
            line-height: 1;
            flex-shrink: 0;
        }

        .alimento-emoji {
            margin-right: 8px;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .alimento-nome {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fiammella per cottura in friggitrice */
        .alimento-nome.clickable {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: rgba(0, 223, 130, 0.4);
            text-underline-offset: 4px;
            transition: color 0.2s;
        }

        .alimento-nome.clickable:hover {
            color: var(--accent);
        }

        .airfryer-badge {
            margin-left: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
        }

        /* Tratteggio dinamico */
        .alimento-leader {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(82, 107, 107, 0.35);
            margin: 0 10px;
            position: relative;
            top: 4px;
            height: 1px;
        }

        .alimento-quantita {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            flex-shrink: 0;
            text-align: right;
        }

        /* --- CHECKBOX PREMIUM --- */
        .checkbox-container {
            position: relative;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .checkbox-container input:disabled {
            cursor: not-allowed;
        }

        .custom-checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 34px;
            width: 34px;
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .checkbox-container input:checked ~ .custom-checkmark {
            background-color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(0, 223, 130, 0.35);
        }

        .custom-checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 11px;
            top: 6px;
            width: 6px;
            height: 13px;
            border: solid var(--bg-deep);
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        .checkbox-container input:checked ~ .custom-checkmark:after {
            display: block;
        }

        /* Stato completato per l'intera card */
        .pasto-card.completed {
            opacity: 0.35;
            border-color: transparent;
            background: rgba(10, 26, 26, 0.4);
        }

        .pasto-card.completed .alimento-nome {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* --- FINESTRE MODALI (OVERLAYS) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 380px;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: translateY(30px);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close-btn:hover {
            color: var(--white);
        }

        /* Stile Lista Giorni (Screenshot 1) */
        .day-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .day-option {
            background: rgba(10, 26, 26, 0.4);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-option.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 223, 130, 0.05);
        }

        .day-option:active {
            transform: scale(0.98);
            background: rgba(0, 223, 130, 0.1);
        }

        /* Dettagli Cottura */
        .cooking-detail-item {
            background: rgba(10, 26, 26, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cooking-detail-item span {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .cooking-detail-item strong {
            color: var(--accent);
            font-weight: 700;
        }

        .modal-action-btn {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 14px;
            transition: transform 0.15s ease;
        }

        .modal-action-btn:active {
            transform: scale(0.97);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ADMIN --- */
        .admin-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .admin-btn.active {
            background: rgba(0, 223, 130, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .admin-toolbar {
            display: none;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        .pasto-card.editing {
            border-color: var(--accent);
            align-items: stretch;
        }

        .edit-alimento-block {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .edit-row input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--white);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            min-width: 0;
        }

        .edit-row .input-emoji { width: 50px; text-align: center; flex-shrink: 0; }
        .edit-row .input-nome { flex: 1; }
        .edit-row .input-qty { width: 90px; flex-shrink: 0; }
        .edit-row .input-cook { flex: 1; font-size: 0.75rem; }

        .cook-fields-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .btn-remove-row {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .pasto-edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .pasto-edit-actions .btn-primary { flex: 1; }

        .pasto-header-edit {
            margin-bottom: 14px;
        }

        .input-titolo-pasto {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--accent);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .pasto-card-admin-actions {
            display: flex;
            gap: 8px;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .login-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--white);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .login-error {
            color: #ef4444;
            font-size: 0.8rem;
            margin-bottom: 12px;
            display: none;
        }

        .btn-modal-submit {
            width: 100%;
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>

        function renderDayModalOptions() {
            const container = document.getElementById("day-options-container");
            container.innerHTML = "";

            const giorniOrdinati = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
            
            giorniOrdinati.forEach(giorno => {
                const isActive = (giorno === giornoVisualizzato);
                const isRealToday = (giorno === nomeGiornoReale);
                
                const btn = document.createElement("button");
                btn.className = `day-option ${isActive ? 'active' : ''}`;
                btn.onclick = () => selezionaGiorno(giorno);
                
                btn.innerHTML = `
                    <span>${giorno}</span>
                    ${isRealToday ? '<span style="font-size: 0.7rem; background: rgba(0,223,130,0.15); padding: 4px 8px; border-radius: 6px; color: var(--accent);">OGGI</span>' : ''}
                `;
                container.appendChild(btn);
            });

        // --- CARICAMENTO DATI ---
        async function caricaEInizializzaPasti() {
            const isToday = (giornoVisualizzato === nomeGiornoReale);

            document.getElementById("badge-text").innerText = giornoVisualizzato;

            const notice = document.getElementById("read-only-notice");
            if (!isToday) {
                notice.style.display = "flex";
                notice.querySelector('span:last-child').innerText = `Sola Lettura. I pasti del ${giornoVisualizzato} non sono modificabili (oggi è ${nomeGiornoReale}).`;
            } else {
                notice.style.display = "none";
            }

            let statiCheckbox = {};
            let docSnap = null;

            try {
                docSnap = await getDoc(docRef);
            } catch (e) {
                console.log("Firestore offline o errore di connessione.");
            }

            if (docSnap && docSnap.exists()) {
                const datiCloud = docSnap.data();

                if (datiCloud.piano) {
                    pianoData = datiCloud.piano;
                } else {
                    pianoData = JSON.parse(JSON.stringify(dietaDefaultTeo));
                    try { await setDoc(docRef, { piano: pianoData }, { merge: true }); } catch (e) {}
                }

                if (isToday) {
                    if (datiCloud.last_date !== stringaDataReale) {
                        await setDoc(docRef, { last_date: stringaDataReale, pasti: {} }, { merge: true });
                    } else {
                        statiCheckbox = datiCloud.pasti || {};
                    }
                }
            } else {
                pianoData = JSON.parse(JSON.stringify(dietaDefaultTeo));
                try {
                    await setDoc(docRef, { last_date: stringaDataReale, pasti: {}, piano: pianoData });
                } catch (e) {}
            }

            renderPasti(statiCheckbox, isToday);
        }

        async function salvaPianoGiorno() {
            try {
                await updateDoc(docRef, { [`piano.${giornoVisualizzato}`]: pianoData[giornoVisualizzato] });
            } catch (e) {
                alert("Errore durante il salvataggio. Controlla la connessione e riprova.");
                console.error(e);
            }
        }

        function generaIdPasto() {
            return "p_" + Math.random().toString(36).substring(2, 9);
        }

        // --- AZIONI ADMIN SUI PASTI ---
        window.aggiungiNuovoPasto = function() {
            const nome = prompt("Nome del nuovo pasto (es. Spuntino serale):");
            if (!nome || !nome.trim()) return;
            if (!pianoData[giornoVisualizzato]) pianoData[giornoVisualizzato] = [];
            const nuovoPasto = { id: generaIdPasto(), tipo: nome.trim(), alimenti: [] };
            pianoData[giornoVisualizzato].push(nuovoPasto);
            editingPastoId = nuovoPasto.id;
            salvaPianoGiorno().then(() => renderPasti({}, giornoVisualizzato === nomeGiornoReale));
        };

        window.modificaPasto = function(pastoId) {
            editingPastoId = pastoId;
            renderPasti({}, giornoVisualizzato === nomeGiornoReale);
        };

        window.annullaModificaPasto = function() {
            editingPastoId = null;
            caricaEInizializzaPasti();
        };

        window.eliminaPasto = function(pastoId) {
            if (!confirm("Eliminare questo pasto dal piano?")) return;
            pianoData[giornoVisualizzato] = (pianoData[giornoVisualizzato] || []).filter(p => p.id !== pastoId);
            editingPastoId = null;
            salvaPianoGiorno().then(() => caricaEInizializzaPasti());
        };

        window.aggiungiRigaAlimento = function(pastoId) {
            const container = document.getElementById(`edit-alimenti-${pastoId}`);
            const block = document.createElement("div");
            block.className = "edit-alimento-block";
            block.innerHTML = creaCampiAlimento({});
            container.appendChild(block);
        };

        function creaCampiAlimento(alimento) {
            const af = alimento.airFryer || {};
            const esc = (v) => (v || '').toString().replace(/"/g, '&quot;');
            return `
                <div class="edit-row">
                    <input type="text" class="input-emoji" placeholder="🍽️" value="${esc(alimento.emoji)}">
                    <input type="text" class="input-nome" placeholder="Nome alimento" value="${esc(alimento.nome)}">
                    <input type="text" class="input-qty" placeholder="Quantità" value="${esc(alimento.quantita)}">
                    <button type="button" class="btn-remove-row" onclick="this.closest('.edit-alimento-block').remove()">✕</button>
                </div>
                <div class="cook-fields-label">🔥 Cottura (facoltativo, per la fiammella)</div>
                <div class="edit-row">
                    <input type="text" class="input-cook input-cook-metodo" placeholder="Metodo (es. Friggitrice)" value="${esc(af.metodo)}">
                    <input type="text" class="input-cook input-cook-temp" placeholder="Temp (es. 190°C)" value="${esc(af.temp)}">
                    <input type="text" class="input-cook input-cook-min" placeholder="Minuti (es. 10 min)" value="${esc(af.minuti)}">
                </div>
            `;
        }

        window.salvaPasto = function(pastoId) {
            const pasto = (pianoData[giornoVisualizzato] || []).find(p => p.id === pastoId);
            if (!pasto) return;

            const titleInput = document.getElementById(`edit-titolo-${pastoId}`);
            pasto.tipo = titleInput.value.trim() || pasto.tipo;

            const blocks = document.querySelectorAll(`#edit-alimenti-${pastoId} .edit-alimento-block`);
            const nuoviAlimenti = [];
            blocks.forEach(block => {
                const nome = block.querySelector(".input-nome").value.trim();
                if (!nome) return;
                const emoji = block.querySelector(".input-emoji").value.trim();
                const quantita = block.querySelector(".input-qty").value.trim();
                const metodo = block.querySelector(".input-cook-metodo").value.trim();
                const temp = block.querySelector(".input-cook-temp").value.trim();
                const minuti = block.querySelector(".input-cook-min").value.trim();

                const nuovoAlimento = { emoji: emoji || "🍽️", nome, quantita: quantita || "q.b." };
                if (metodo || temp || minuti) {
                    nuovoAlimento.airFryer = { metodo, temp, minuti };
                }
                nuoviAlimenti.push(nuovoAlimento);
            });
            pasto.alimenti = nuoviAlimenti;
            editingPastoId = null;
            salvaPianoGiorno().then(() => caricaEInizializzaPasti());
        };

        // --- RENDER ---
        function renderPasti(statiCheckbox, isToday) {
            const toolbar = document.getElementById("admin-toolbar");
            if (toolbar) toolbar.style.display = isAdminMode ? "flex" : "none";

            const pastiDelGiorno = pianoData[giornoVisualizzato] || [];
            const container = document.getElementById("pasti-container");
            container.innerHTML = "";

            if (pastiDelGiorno.length === 0) {
                container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 30px 0;">Nessun pasto per questo giorno.</div>`;
            }

            pastiDelGiorno.forEach(pasto => {
                const isChecked = isToday ? (statiCheckbox[pasto.id] || false) : false;

                const card = document.createElement("div");
                card.id = `card-${pasto.id}`;

                if (isAdminMode && editingPastoId === pasto.id) {
                    card.className = "pasto-card editing";
                    let blocksHtml = "";
                    pasto.alimenti.forEach(alimento => {
                        blocksHtml += `<div class="edit-alimento-block">${creaCampiAlimento(alimento)}</div>`;
                    });
                    card.innerHTML = `
                        <div style="width:100%;">
                            <div class="pasto-header-edit">
                                <input type="text" id="edit-titolo-${pasto.id}" class="input-titolo-pasto" value="${pasto.tipo}">
                            </div>
                            <div id="edit-alimenti-${pasto.id}">${blocksHtml}</div>
                            <button type="button" class="btn-secondary" style="margin-top:4px; width:100%;" onclick="aggiungiRigaAlimento('${pasto.id}')">+ Aggiungi Alimento</button>
                            <div class="pasto-edit-actions">
                                <button class="btn-primary" onclick="salvaPasto('${pasto.id}')">Salva</button>
                                <button class="btn-secondary" onclick="annullaModificaPasto()">Annulla</button>
                                <button class="btn-danger" onclick="eliminaPasto('${pasto.id}')">Elimina</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                    return;
                }

                card.className = `pasto-card ${isChecked ? 'completed' : ''}`;

                let alimentiHTML = "";
                pasto.alimenti.forEach(alimento => {
                    const haAirfryer = !!alimento.airFryer;
                    const clickAttr = haAirfryer
                        ? `onclick="mostraCottura('${alimento.nome.replace(/'/g, "\\'")}', '${alimento.airFryer.metodo}', '${alimento.airFryer.temp}', '${alimento.airFryer.minuti}')"`
                        : "";
                    const airfryerFlame = haAirfryer ? `<span class="airfryer-badge" ${clickAttr}>🔥</span>` : "";

                    alimentiHTML += `
                        <div class="alimento-row">
                            <span class="alimento-dot">•</span>
                            <span class="alimento-emoji">${alimento.emoji}</span>
                            <span class="alimento-nome ${haAirfryer ? 'clickable' : ''}" ${clickAttr}>
                                ${alimento.nome}
                            </span>
                            ${airfryerFlame}
                            <span class="alimento-leader"></span>
                            <span class="alimento-quantita">${alimento.quantita}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="pasto-main-content">
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                            <span class="pasto-label">${pasto.tipo}</span>
                            ${isAdminMode ? `
                            <div class="pasto-card-admin-actions">
                                <button type="button" class="icon-btn" onclick="modificaPasto('${pasto.id}')" title="Modifica">✏️</button>
                                <button type="button" class="icon-btn" onclick="eliminaPasto('${pasto.id}')" title="Elimina">🗑️</button>
                            </div>` : ''}
                        </div>
                        <div class="alimenti-list">
                            ${alimentiHTML}
                        </div>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="check-${pasto.id}" ${isChecked ? 'checked' : ''} ${!isToday ? 'disabled' : ''}>
                        <span class="custom-checkmark"></span>
                    </div>
                `;

                container.appendChild(card);

                if (isToday) {
                    const input = card.querySelector(`input[type="checkbox"]`);
                    input.addEventListener('change', async (e) => {
                        const checked = e.target.checked;
                        if (checked) {
                            card.classList.add('completed');
                        } else {
                            card.classList.remove('completed');
                        }

                        try {
                            await updateDoc(docRef, {
                                [`pasti.${pasto.id}`]: checked
                            });
                        } catch (err) {
                            console.error("Errore nel salvataggio su Firebase:", err);
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
